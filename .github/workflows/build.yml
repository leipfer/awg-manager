name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Проверка синтаксиса
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Компиляция Python
        run: |
          python -m compileall -q src helper/awg-helper helper/awg-split bin
      - name: Проверка shell-скриптов
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          bash -n build.sh bin/awg-run-direct bin/awg-setup-direct
          shellcheck -S warning build.sh bin/awg-run-direct bin/awg-setup-direct || true
      - name: Проверка XML polkit
        run: |
          python -c "import xml.dom.minidom as m; m.parse('data/polkit/org.awgmanager.policy')"

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  build:
    name: Сборка .deb
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Собрать пакет
        run: ./build.sh
      - name: Проверить пакет
        run: |
          sudo apt-get install -y lintian
          lintian --no-tag-display-limit *.deb || true
          dpkg-deb -c *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: awg-manager-deb
          path: '*.deb'

  release:
    name: Публикация релиза
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.deb'
          generate_release_notes: true
